<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COG Viewer - OpenLayers</title>
  <link rel="preconnect" href="https://storage.googleapis.com">
  <link rel="preconnect" href="https://tiles.versatiles.org">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }
    
    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 1rem 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 10;
    }
    
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-top h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0;
    }

    .github-link {
      color: white;
      opacity: 0.9;
      transition: opacity 0.2s;
    }

    .github-link:hover {
      opacity: 1;
    }

    .header-top p {
      font-size: 0.875rem;
      opacity: 0.9;
      margin-top: 0.25rem;
    }

    .header-url {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .header-url input {
      flex: 1;
      padding: 0.5rem 0.75rem;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 4px;
      background: rgba(255,255,255,0.15);
      color: white;
      font-size: 0.8rem;
      outline: none;
    }

    .header-url input::placeholder {
      color: rgba(255,255,255,0.6);
    }

    .header-url input:focus {
      border-color: rgba(255,255,255,0.6);
      background: rgba(255,255,255,0.25);
    }

    .header-url button {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 4px;
      background: rgba(255,255,255,0.25);
      color: white;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .header-url button:hover {
      background: rgba(255,255,255,0.35);
    }
    
    #map {
      flex: 1;
      width: 100%;
      background: #1a1a2e;
    }
    
    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 1rem 2rem;
      border-radius: 8px;
      font-size: 0.875rem;
      z-index: 100;
      display: none;
    }
    
    .loading.active {
      display: block;
    }
    
    .error {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(220, 38, 38, 0.95);
      color: white;
      padding: 1.5rem 2rem;
      border-radius: 8px;
      font-size: 0.875rem;
      z-index: 100;
      display: none;
      max-width: 80%;
      text-align: center;
    }
    
    .error.active {
      display: block;
    }
    
    .controls {
      position: absolute;
      bottom: 1.5rem;
      left: 1.5rem;
      background: rgba(255,255,255,0.95);
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 10;
      max-width: 300px;
    }
    
    .controls h3 {
      font-size: 0.875rem;
      margin-bottom: 0.5rem;
      color: #333;
    }
    
    .controls p {
      font-size: 0.75rem;
      color: #666;
      line-height: 1.4;
    }
    
    .ol-control {
      background: rgba(255,255,255,0.9) !important;
      border-radius: 4px;
      padding: 2px;
    }
    
    .ol-control button {
      background: #667eea !important;
      color: white !important;
      border: none !important;
      border-radius: 2px !important;
      margin: 1px;
      width: 28px;
      height: 28px;
      font-size: 14px;
      cursor: pointer;
    }
    
    .ol-control button:hover {
      background: #5a6fd6 !important;
    }

    @media (max-width: 768px) {
      .header {
        padding: 0.5rem 1rem;
      }

      .header-top h1 {
        font-size: 1rem;
      }

      .header-top p {
        display: none;
      }

      .header-url {
        margin-top: 0.5rem;
      }

      .header-url input {
        font-size: 0.75rem;
        padding: 0.4rem 0.6rem;
      }

      .header-url button {
        font-size: 0.75rem;
        padding: 0.4rem 0.75rem;
      }

      .controls {
        display: none;
      }

      #coordinate-display {
        display: none !important;
      }

      .mobile-quality-toggle {
        display: flex;
      }
    }

    .mobile-quality-toggle {
      display: none;
      position: absolute;
      bottom: 1rem;
      right: 1rem;
      background: rgba(0, 0, 0, 0.75);
      color: white;
      padding: 0.5rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      z-index: 10;
      cursor: pointer;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .quality-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      flex-shrink: 0;
    }

    .quality-dot.high {
      background: #22c55e;
    }

    .quality-warning-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .quality-warning-modal.active {
      display: flex;
    }

    .quality-warning-content {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      margin: 1rem;
      max-width: 320px;
      text-align: center;
    }

    .quality-warning-content h3 {
      font-size: 1rem;
      margin-bottom: 0.75rem;
      color: #333;
    }

    .quality-warning-content p {
      font-size: 0.85rem;
      color: #666;
      line-height: 1.5;
      margin-bottom: 1.25rem;
    }

    .quality-warning-actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
    }

    .quality-warning-actions button {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      border: none;
    }

    #quality-cancel {
      background: #e5e7eb;
      color: #333;
    }

    #quality-confirm {
      background: #667eea;
      color: white;
    }
  </style>
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-top">
        <div>
          <h1>🛰️ COG Viewer</h1>
          <p>Hurricane Harvey SkySat 영상 | OpenLayers 10.x + Vite</p>
        </div>
        <a href="https://github.com/conaonda/COGnito" target="_blank" rel="noopener noreferrer" class="github-link" title="GitHub">
          <svg width="24" height="24" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/>
          </svg>
        </a>
      </div>
      <div class="header-url">
        <input type="text" id="cog-url-input" placeholder="COG URL 입력">
        <button id="cog-url-load">로드</button>
      </div>
    </header>
    <div id="map"></div>
    <div id="loading" class="loading">영상 로딩 중...</div>
    <div id="error" class="error"></div>
    <div class="controls">
      <h3>영상 정보</h3>
      <p>SkySat_20170831T195552Z_RGB.tif<br>
      Hurricane Harvey 재해 지역<br>
      2017년 8월 31일 촬영</p>
    </div>
    <div id="mobile-quality-toggle" class="mobile-quality-toggle">
      <span id="quality-dot" class="quality-dot"></span>
      <span id="quality-label">저해상도</span>
    </div>
    <div id="quality-warning-modal" class="quality-warning-modal">
      <div class="quality-warning-content">
        <h3>고해상도 영상 로드</h3>
        <p>고해상도 영상은 모바일 데이터 사용량이 크게 증가할 수 있습니다. Wi-Fi 환경에서 사용을 권장합니다.</p>
        <div class="quality-warning-actions">
          <button id="quality-cancel">취소</button>
          <button id="quality-confirm">고해상도로 보기</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
