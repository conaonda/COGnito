name: Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build for preview
        run: npx vite build --base /COGnito/preview/pr-${{ github.event.pull_request.number }}/
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CORS_PROXY_URL: https://cog-cors-proxy.conaonda.workers.dev
          VITE_IMAGE_DESCRIPTOR_URL: ${{ secrets.VITE_IMAGE_DESCRIPTOR_URL }}
          VITE_IMAGE_DESCRIPTOR_API_KEY: ${{ secrets.VITE_IMAGE_DESCRIPTOR_API_KEY }}

      - name: Verify build output
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          BASE="/COGnito/preview/pr-${PR_NUM}/"

          # 필수 파일 존재 확인
          test -f dist/index.html || { echo "ERROR: dist/index.html not found"; exit 1; }
          test -f dist/style.json || { echo "ERROR: dist/style.json not found"; exit 1; }
          test -f dist/sw.js || { echo "ERROR: dist/sw.js not found"; exit 1; }
          test -d dist/assets || { echo "ERROR: dist/assets not found"; exit 1; }

          # HTML 내 에셋 경로가 preview base path를 사용하는지 확인
          grep -q "${BASE}assets/" dist/index.html || { echo "ERROR: asset paths do not use preview base path"; exit 1; }

          echo "Build verification passed: all files present, base path correct (${BASE})"

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: preview/pr-${{ github.event.pull_request.number }}
          keep_files: true

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const previewUrl = `https://${context.repo.owner}.github.io/COGnito/preview/pr-${prNumber}/`;
            const marker = '<!-- preview-deployment -->';
            const body = [
              marker,
              `**Preview deployment is ready**`,
              '',
              previewUrl,
              '',
              `_Last updated: ${new Date().toISOString()}_`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove preview
        run: |
          PR_DIR="preview/pr-${{ github.event.pull_request.number }}"
          if [ -d "$PR_DIR" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -rf "$PR_DIR"
            git commit -m "Remove preview for PR #${{ github.event.pull_request.number }}"
            git push origin gh-pages
          fi
