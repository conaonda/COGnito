name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CORS_PROXY_URL: https://cog-cors-proxy.conaonda.workers.dev

      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "ERROR: dist/index.html not found"; exit 1; }
          test -d dist/assets || { echo "ERROR: dist/assets not found"; exit 1; }

      - name: Preserve preview deployments
        run: |
          if git fetch origin gh-pages --depth=1 2>/dev/null; then
            git worktree add gh-pages-branch origin/gh-pages
            if [ -d gh-pages-branch/preview ]; then
              cp -r gh-pages-branch/preview dist/preview
            fi
            git worktree remove gh-pages-branch
          fi

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Detect changed paths
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            core:
              - 'src/main.js'
              - 'index.html'
              - 'vite.config.js'
            cog:
              - 'src/proxy.js'
            stac:
              - 'src/stac.js'
              - 'src/stacUI.js'
            auth:
              - 'src/auth.js'
              - 'src/authUI.js'
            catalog:
              - 'src/catalog.js'
              - 'src/catalogUI.js'
              - 'src/registerUI.js'
              - 'src/likes.js'
              - 'src/watchlist.js'
              - 'src/watchlistUI.js'
            ci:
              - '.github/workflows/**'
              - 'playwright.config.js'
              - 'playwright.auth.config.js'
              - 'vitest.config.js'

      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium --with-deps

      - name: Install Playwright dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_CORS_PROXY_URL: https://cog-cors-proxy.conaonda.workers.dev

      - name: Run unit tests with coverage
        run: npx vitest run --coverage
        env:
          CI: true

      # core 또는 CI 변경 시 전체 테스트, 아니면 관련 그룹만 실행
      - name: Run all tests
        if: steps.changes.outputs.core == 'true' || steps.changes.outputs.ci == 'true'
        run: npx playwright test
        env:
          CI: true

      - name: Run core tests for STAC changes
        if: steps.changes.outputs.core != 'true' && steps.changes.outputs.ci != 'true' && steps.changes.outputs.stac == 'true'
        run: npx playwright test --project=core
        env:
          CI: true

      - name: Run catalog UI smoke tests
        if: steps.changes.outputs.core != 'true' && steps.changes.outputs.ci != 'true' && steps.changes.outputs.catalog == 'true'
        run: npx playwright test --config=playwright.auth.config.js
        env:
          CI: true

      - name: Run auth tests
        if: steps.changes.outputs.auth == 'true' || steps.changes.outputs.core == 'true' || steps.changes.outputs.ci == 'true' || steps.changes.outputs.catalog == 'true'
        run: npx playwright test --config=playwright.auth.config.js
        env:
          CI: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
