          <h1>COGnito <span id="app-version" style="font-size:0.65rem;font-weight:400;opacity:0.7;vertical-align:middle"></span> <a href="https://github.com/conaonda/COGnito" target="_blank" rel="noopener noreferrer" class="github-link" title="GitHub"><svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/></svg></a></h1>
          <p id="viewer-subtitle">OpenLayers 10.x + Vite</p>
        </div>
      </div>
      <div class="header-url">
        <input type="text" id="cog-url-input" placeholder="COG URL 입력">
        <button id="cog-url-load">로드</button>
        <button id="cog-register-btn" style="display:none">등록</button>
      </div>
    </header>
    <div id="map"></div>
    <div id="loading" class="loading">영상 로딩 중...</div>
    <div id="error" class="error"></div>
    <div class="controls">
      <h3 id="controls-title">영상 정보</h3>
      <p id="controls-info">-</p>
    </div>
    <div id="mobile-quality-toggle" class="mobile-quality-toggle">
      <span id="quality-dot" class="quality-dot"></span>
      <span id="quality-label">저해상도</span>
    </div>
    <div id="quality-warning-modal" class="quality-warning-modal">
      <div class="quality-warning-content">
        <h3>고해상도 영상 로드</h3>
        <p>고해상도 영상은 모바일 데이터 사용량이 크게 증가할 수 있습니다. Wi-Fi 환경에서 사용을 권장합니다.</p>
        <div class="quality-warning-actions">
          <button id="quality-cancel">취소</button>
          <button id="quality-confirm">고해상도로 보기</button>
        </div>
      </div>
    </div>
    <button id="catalog-toggle-btn" class="catalog-toggle-btn" title="카탈로그">&#9776;</button>
    <div id="catalog-panel" class="catalog-panel">
      <div class="catalog-panel-header">
        <h3>영상 카탈로그</h3>
        <button id="catalog-panel-close" class="catalog-panel-close">✕</button>
      </div>
      <input type="text" id="catalog-search" class="catalog-search" placeholder="제목/설명 검색...">
      <div id="catalog-list" class="catalog-list"></div>
      <div class="catalog-pagination">
        <button id="catalog-prev" disabled>&larr;</button>
        <span id="catalog-page-info"></span>
        <button id="catalog-next">&rarr;</button>
      </div>
    </div>
    <button id="stac-toggle-btn" class="stac-toggle-btn" title="STAC 검색">STAC</button>
    <div id="stac-panel" class="stac-panel">
      <div class="stac-panel-header">
        <h3>STAC 검색</h3>
        <button id="stac-panel-close" class="stac-panel-close">✕</button>
      </div>
      <div class="stac-controls">
        <select id="stac-preset">
          <option value="">STAC API 선택...</option>
          <option value="https://earth-search.aws.element84.com/v1">Earth Search (AWS)</option>
          <option value="https://planetarycomputer.microsoft.com/api/stac/v1">Planetary Computer</option>
          <option value="custom">커스텀 URL 입력</option>
        </select>
        <input type="text" id="stac-custom-url" placeholder="STAC API URL" style="display:none">
        <select id="stac-collection">
          <option value="">컬렉션 선택...</option>
        </select>
        <label><input type="checkbox" id="stac-use-bbox"> 현재 맵 범위로 검색</label>
        <div class="stac-date-row">
          <input type="date" id="stac-date-from" title="시작일">
          <input type="date" id="stac-date-to" title="종료일">
        </div>
        <button id="stac-search-btn" class="stac-search-btn">검색</button>
      </div>
      <div id="stac-status" class="stac-status"></div>
      <div id="stac-results" class="stac-results"></div>
    </div>
  </div>
</body>
</html>
